name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
        env:
          SPUN_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
          SPUN_CHROMIUM_NO_SANDBOX: "1"
